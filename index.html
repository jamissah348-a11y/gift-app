<script>
new TradingView.widget({"autosize":true,"symbol":"OANDA:XAUUSD","interval":"15","timezone":"Etc/UTC","theme":"dark","style":"1","locale":"en","enable_publishing":false,"allow_symbol_change":true,"container_id":"tv"});
function askAI(){
let q=document.getElementById('aiInput').value;
if(!q) return;
document.getElementById('aiReply').innerHTML="Thinking... 💎";
setTimeout(()=>{document.getElementById('aiReply').innerHTML="💡 <b>TradingPro AI:</b><br>For "+q+" - Wait for BOS, risk 1-2%, SL behind structure. Don't chase! Diamond hands = diamond profits!";},1000);
}
function saveTrade(){
let p=document.getElementById('pair').value;
let e=document.getElementById('entry').value;
let r=document.getElementById('result').value;
if(!p) return;
let div=document.createElement('div');
div.className="bg-black p-2 rounded border border-zinc-800";
div.innerHTML="<b>"+p+"</b> @ "+e+" => "+r;
document.getElementById('journalList').prepend(div);
document.getElementById('pair').value="";document.getElementById('entry').value="";document.getElementById('result').value="";
}
</script>
