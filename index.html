<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingPro AI - Ghana's #1 Trading App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif}</style>
</head>
<body class="bg-black text-white">
<header class="p-4 flex justify-between items-center border-b border-yellow-500/20">
<div class="flex items-center gap-2"><div class="w-10 h-10 bg-yellow-400 rounded-xl flex items-center justify-center font-black text-black">TP</div><span class="font-black text-xl">TradingPro</span></div>
<button onclick="document.getElementById('pay').scrollIntoView()" class="bg-yellow-400 text-black px-6 py-2 rounded-full font-bold">Subscribe GH₵100</button>
</header>
<div class="max-w-6xl mx-auto p-4 grid md:grid-cols-3 gap-6 mt-6">
<div class="md:col-span-2">
<div class="bg-zinc-900 rounded-3xl p-5">
<h2 class="text-2xl font-black mb-4">🤖 AI Trading Mentor <span class="text-yellow-400">LIVE</span></h2>
<div id="chat" class="h-96 overflow-y-auto bg-black rounded-2xl p-4 mb-4 space-y-3"></div>
<div class="flex gap-2">
<input id="inp" class="flex-1 bg-zinc-800 p-4 rounded-xl outline-none border border-zinc-700 focus:border-yellow-400" placeholder="Ask: Should I buy Gold? What is lot size?" onkeypress="if(event.key==='Enter')send()">
<button onclick="send()" class="bg-yellow-400 text-black px-8 py-4 rounded-xl font-black">SEND</button>
</div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-4">
<button onclick="quick('Gold analysis')" class="bg-zinc-800 py-2 rounded-lg text-sm">🥇 Gold</button>
<button onclick="quick('EURUSD')" class="bg-zinc-800 py-2 rounded-lg text-sm">💶 EURUSD</button>
<button onclick="quick('What is lot size')" class="bg-zinc-800 py-2 rounded-lg text-sm">📏 Lot size</button>
<button onclick="quick('Risk management')" class="bg-zinc-800 py-2 rounded-lg text-sm">🛡️ Risk</button>
</div>
</div>
</div>
<div class="space-y-4">
<div class="bg-gradient-to-br from-yellow-400 to-orange-500 p-6 rounded-3xl text-black">
<h3 class="font-black text-xl">🚀 Pro Membership</h3>
<p class="mt-2 font-bold">Get full AI mentor + signals daily!</p>
<ul class="mt-3 text-sm font-bold space-y-1"><li>✓ Unlimited AI chat</li><li>✓ Daily Gold & Forex signals</li><li>✓ Risk calculator</li><li>✓ WhatsApp support</li></ul>
<button onclick="pay()" class="w-full bg-black text-yellow-400 mt-4 py-3 rounded-xl font-black">Pay GH₵100 with Paystack</button>
</div>
<div id="pay" class="bg-zinc-900 p-5 rounded-3xl">
<h3 class="font-bold">XAUUSD Chart</h3>
<div class="mt-3 h-48 bg-black rounded-xl flex items-center justify-center text-zinc-600 text-center p-4">📈 Live TradingView<br>Gold BULLISH today!<br>Support: 2035 | Resistance: 2060</div>
</div>
</div>
</div>
<script>
const KB={
 gold:"GOLD (XAUUSD) 🔥 BULLISH TODAY!\n\n📍 Buy zone: 2035-2040\n🛑 Stop Loss: 2025\n🎯 TP1: 2055\n🎯 TP2: 2070\n\nRSI: 68 (strong)\nStrategy: Buy the dip, don't chase!\n⚠️ Avoid 2pm GMT news!",
 eurusd:"EURUSD 📈 UPTREND!\nSupport: 1.0850\nResistance: 1.0920\nPlan: Wait retest 1.0860 then buy\nSL: 1.0830\nTP: 1.0920\nRR: 1:2.6 ✅",
 gbpusd:"GBPUSD ⚡ Volatile!\nRange: 1.2700-1.2800\nDon't guess — wait breakout!\nRisk 1% only!",
 btc:"BTC 🚀 Bullish above 67k! Next target 70k. Buy dips only!",
 "lot size":"LOT SIZE FORMULA 💎\nLot = Risk$ / (SL pips x $10)\n\nExample: $1000 account, risk 1% = $10\nSL = 20 pips\nLot = 10/(20x10)=0.05 lot\n\nGolden rule: NEVER risk >2%!",
 risk:"RISK MANAGEMENT 🛡️\nRule 1: Risk 1% per trade\n10 losses = -10% only (safe)\nIf you risk 10% = BLOWN in 10 trades!\nRule 2: Always use 1:2 RR\nRule 3: Max 3 trades per day!",
 strategy:"BEST STRATEGY FOR BEGINNERS 🎯\n1. Mark Daily Support/Resistance\n2. Wait price at level\n3. Check RSI\n4. Enter with 1:2 RR\n5. Journal every trade!\n\nThis alone makes you profitable!",
 default:"Hey boss! I'm your TradingPro AI Mentor 🇬🇭\n\nAsk me anything:\n• Gold analysis 🥇\n• EURUSD / GBPUSD / BTC\n• Lot size calculator 📏\n• Risk management 🛡️\n• Trading strategy 🎯\n\nTry typing 'Gold'!"
};
let msgs=[{from:'ai',text:KB.default}];
function render(){
 document.getElementById('chat').innerHTML=msgs.map(m=>`<div class='${m.from==='ai'?'bg-zinc-800':'bg-yellow-400 text-black ml-auto'} p-3 rounded-2xl max-w-[85%] whitespace-pre-line'>${m.text}</div>`).join('');
 document.getElementById('chat').scrollTop=9999;
}
function getReply(q){
 let l=q.toLowerCase();
 if(l.includes('gold')||l.includes('xau')) return KB.gold;
 if(l.includes('eur')) return KB.eurusd;
 if(l.includes('gbp')) return KB.gbpusd;
 if(l.includes('btc')||l.includes('bitcoin')) return KB.btc;
 if(l.includes('lot')) return KB['lot size'];
 if(l.includes('risk')) return KB.risk;
 if(l.includes('strategy')||l.includes('how to trade')) return KB.strategy;
 if(l.includes('buy')||l.includes('should i')) return KB.gold+"\n\nWant specific pair? Type EURUSD, GBPUSD, BTC";
 return KB.default;
}
function send(){
 let i=document.getElementById('inp');
 if(!i.value.trim())return;
 msgs.push({from:'user',text:i.value});
 msgs.push({from:'ai',text:getReply(i.value)});
 i.value=''; render();
}
function quick(t){ document.getElementById('inp').value=t; send(); }
function pay(){
 alert('Paystack: Replace with your live Paystack link! After payment, user gets Pro access.');
 window.open('https://paystack.com/pay/tradingpro-gh','_blank');
}
render();
</script>
</body>
</html>
