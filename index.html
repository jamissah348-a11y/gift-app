<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRADINGPRO Ghana</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{font-family:Arial;background:#0a0a0a;color:white;text-align:center;padding:20px}
button{padding:15px 30px;background:#00ff88;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:18px}
#app{display:none}
#paywall{padding:40px 20px}
input{padding:12px;border-radius:8px;border:none;width:80%;max-width:300px;margin:10px}
</style>
</head>
<body>

<div id="paywall">
<h1>TRADINGPRO Ghana 🇬🇭</h1>
<p>Pay GHS 160 to unlock lifetime access</p>
<input id="email" type="email" placeholder="Enter your email">
<br>
<button onclick="pay()">Pay GHS 160 with Paystack</button>
<p style="font-size:12px;color:#888;margin-top:20px">Secure payment by Paystack</p>
</div>

<div id="app">
<h1>Welcome to TRADINGPRO! 🎉</h1>
<p>Your trading dashboard is here...</p>
<!-- PUT YOUR TRADING APP CONTENT HERE -->
</div>

<script>
// --- OWNER FREE ACCESS - NO PAYMENT NEEDED ---
(function(){
  const params = new URLSearchParams(window.location.search);
  if(params.has('owner')){
    localStorage.setItem('tradingpro_paid','true');
  }
  if(localStorage.getItem('tradingpro_paid')==='true'){
    setTimeout(()=>{
      const pw = document.getElementById('paywall');
      const app = document.getElementById('app');
      if(pw) pw.style.display='none';
      if(app) app.style.display='block';
    },500);
  }
})();
// --- END OWNER BYPASS ---

function pay(){
let email=document.getElementById('email').value;
if(!email){alert('Enter email first');return}
let handler=PaystackPop.setup({
key:'pk_live_78ee2104066f781f85ea14f62c83bedd70c13a90',
email:email,
amount:16000,
currency:'GHS',
ref:'TP_GH_'+Date.now(),
onClose:function(){alert('Cancelled')},
callback:function(res){
document.getElementById('paywall').style.display='none';
document.getElementById('app').style.display='block';
localStorage.setItem('tradingpro_paid','true');
alert('Welcome! Ref: '+res.reference);
}
});
handler.openIframe();
}
</script>

</body>
</html>
